apiVersion: 1
groups:
    - orgId: 1
      name: ev_group1_30min
      folder: alert_folder
      interval: 30m
      rules:
        - uid: eg3llwpdznu9sd
          title: 'alert1 '
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: influxdb-ims
              model:
                intervalMs: 1000
                maxDataPoints: 43200
                query: "from(bucket: \"bearings\")\r\n  |> range(start: 2004-02-12T10:00:00Z, stop: 2004-02-19T07:00:00Z)\r\n  |> filter(fn: (r) => r._measurement == \"vibration\" and r._field == \"rms\" and r.bearing == \"bearing_1\")\r\n  |> aggregateWindow(every: 15m, fn: mean, createEmpty: false)"
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - B
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.10
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 30m
          annotations:
            description: rms
            summary: alert 0.10
          labels: {}
          isPaused: false
          notification_settings:
            receiver: grafana-default-email
